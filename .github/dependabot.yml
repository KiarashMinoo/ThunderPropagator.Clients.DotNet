version: 2
updates:
  # Keep NuGet packages up-to-date.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "security"
    # This project only references the internal ThunderPropagator.BuildingBlocks
    # package (no third-party NuGet dependencies), so no grouping is needed.
    open-pull-requests-limit: 10

  # Keep GitHub Actions pinned and up-to-date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "security"
      - "ci"
    open-pull-requests-limit: 5
